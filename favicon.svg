<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f4d03f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#goldGradient)" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Sun/Morning Light symbol -->
  <circle cx="50" cy="50" r="20" fill="#1a1a1a" opacity="0.3"/>
  <circle cx="50" cy="50" r="15" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Rays of light -->
  <line x1="50" y1="10" x2="50" y2="25" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="75" x2="50" y2="90" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="25" y2="50" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="50" x2="90" y2="50" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Diagonal rays -->
  <line x1="25" y1="25" x2="35" y2="35" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="25" x2="65" y2="35" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="25" y1="75" x2="35" y2="65" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="75" x2="65" y2="65" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Precious metal bar symbol at bottom -->
  <rect x="30" y="65" width="40" height="8" rx="2" fill="#1a1a1a" opacity="0.6"/>
  <rect x="32" y="67" width="36" height="4" rx="1" fill="url(#goldGradient)"/>
</svg>

